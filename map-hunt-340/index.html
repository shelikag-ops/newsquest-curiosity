<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewsQuest Map Hunt: Issue 340</title>
<style>
:root{--navy:#14213d;--red:#d62839;--yellow:#ffd166;--sea:#cfe3f2;--land:#f4efe2;--line:#8a8f99;--ink:#1d2433;--green:#1e7a45}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);display:grid;grid-template-columns:380px 1fr;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/3;background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:14px}
header h1{font-size:19px;margin:0}header .p{margin-left:auto;font-size:13px;color:#c9d1e3}
aside{overflow:auto;background:#f6f7f9;border-right:1px solid #e3e6ec;padding:12px}
.intro{font-size:13.5px;background:#fff;border:1px solid #e3e6ec;border-radius:8px;padding:10px;margin-bottom:10px}
.intro b{color:var(--red)}
.clue{background:#fff;border:2px solid #e3e6ec;border-radius:10px;padding:8px 10px;margin:6px 0;cursor:pointer;display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start}
.clue.on{border-color:var(--red);box-shadow:0 0 0 3px #d628391f}
.clue .b{width:28px;height:28px;border-radius:50%;background:#e3e6ec;color:var(--navy);font-weight:700;display:grid;place-items:center;font-size:13px}
.clue.done .b{background:var(--navy);color:#fff}
.clue .k{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--navy)}
.lv{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:#8a8f99;margin-left:6px;font-weight:600}
.clue .h{font-size:13.5px;color:#2b3242;margin:2px 0 6px}
.clue input{font:inherit;width:100%;padding:6px 8px;border:1px solid #c8ccd4;border-radius:6px}
.clue .row{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:12.5px;color:#4a5263}
.clue .row button{font:inherit;font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid #c8ccd4;background:#fff;cursor:pointer}
.clue .row .pinned{color:var(--green);font-weight:700}
#mapwrap{position:relative;background:var(--sea);overflow:hidden}
svg{width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
.country{fill:var(--land);stroke:var(--line);stroke-width:.6px;vector-effect:non-scaling-stroke}
.state{fill:none;stroke:#b3b7bf;stroke-width:.5px;vector-effect:non-scaling-stroke}
.grat{fill:none;stroke:#ffffff;stroke-width:.5px;vector-effect:non-scaling-stroke;opacity:.6}
.sphere{fill:var(--sea)}
.pin circle{fill:var(--red);stroke:#fff;stroke-width:2px;vector-effect:non-scaling-stroke}
.pin text{fill:#fff;font:700 11px system-ui;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin.cur circle{fill:var(--navy)}
.tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.tools button{width:38px;height:38px;border-radius:8px;border:1px solid #c8ccd4;background:#fff;font-size:19px;cursor:pointer}
.tools button:disabled{opacity:.4;cursor:default}
.status{position:absolute;left:12px;bottom:12px;right:12px;background:#ffffffee;border-radius:8px;padding:8px 12px;font-size:14px;box-shadow:0 2px 8px #0002;pointer-events:none}
.sub{background:#fff;border:1px solid #e3e6ec;border-radius:10px;padding:10px;margin-top:12px}
.sub input,.sub select{font:inherit;width:100%;padding:7px;margin:4px 0;border:1px solid #c8ccd4;border-radius:6px}
.btn{font:inherit;font-weight:600;padding:9px 14px;border-radius:8px;border:0;background:var(--red);color:#fff;cursor:pointer;width:100%;margin-top:6px}
.note{font-size:12.5px;color:#4a5263;margin-top:6px}
.res td{padding:2px 3px;border-bottom:1px solid #eee;vertical-align:top}
@media (max-width:800px){body{grid-template-columns:1fr;grid-template-rows:auto 55vh 1fr}aside{grid-row:3;border-right:0}#mapwrap{grid-row:2}}
</style></head><body>
<header><h1>NewsQuest Map Hunt: Issue 340</h1><div class="p" id="prog"></div></header>
<aside>
  <div class="intro" id="intro"></div>
  <div id="clues"></div>
  <div class="sub">
    <b>Done? Send your answers</b>
    <input id="nm" placeholder="Your first name" autocomplete="off">
    <input id="em" type="email" placeholder="Email for your score report" autocomplete="email">
    <div class="note">A parent&apos;s email is fine. Your score report goes there.</div>
    <button class="btn" id="go">Submit my answers</button>
    <div id="out"></div>
  </div>
</aside>
<div id="mapwrap"><svg id="map"></svg>
  <div class="tools"><button id="zi" title="Zoom in">+</button><button id="zo" title="Zoom out">&minus;</button><button id="zr" title="Whole world">&#8962;</button><button id="un" title="Undo last pin">&#8630;</button></div>
  <div class="status" id="status"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
const CFG={"issue": "340", "date": "Oct 23, 2026", "title": "NewsQuest Map Hunt: Issue 340", "intro": "Each clue is a mystery <b>country<\/b>, <b>US state<\/b> or <b>sea<\/b> from this week's Week Junior. First, type which place it is. Then tap the map to drop your pin inside it. Use what you know, not a search engine! Each clue is worth 4 points: 1 for the right name and up to 3 for the pin. Made a mistake? Tap the map again to move a pin, press <b>Remove pin<\/b>, or use the &#8630; undo button.", "places": [{"n": 1, "kind": "country", "hint": "Most Nobel Prizes are handed out in this country's capital on December 10.", "level": "medium"}, {"n": 2, "kind": "country", "hint": "The Nobel Peace Prize is the only Nobel Prize given in this country.", "level": "medium"}, {"n": 3, "kind": "country", "hint": "Peace Prize winner Navi Pillay grew up here. F1 last raced in Africa in this country, in 1993.", "level": "medium"}, {"n": 4, "kind": "country", "hint": "Students across this country marched for better schools.", "level": "easy"}, {"n": 5, "kind": "sea", "hint": "Karl Bushby walked across this frozen sea between Alaska and Russia.", "level": "hard"}, {"n": 6, "kind": "sea", "hint": "Bushby swam across it from Kazakhstan to Azerbaijan. Put your pin in the water.", "level": "medium"}, {"n": 7, "kind": "sea", "hint": "Bushby swam across this narrow sea in October, on the last part of his walk home to England.", "level": "medium"}, {"n": 8, "kind": "state", "hint": "The USS Abraham Lincoln came home to San Diego, in this state.", "level": "easy"}, {"n": 9, "kind": "state", "hint": "The first national women's rights convention met in this state in 1850.", "level": "hard"}, {"n": 10, "kind": "state", "hint": "America's newest national park, Chiricahua, is in this state.", "level": "medium"}, {"n": 11, "kind": "state", "hint": "Two giant pandas will make their US debut at the zoo in this state's capital, Atlanta.", "level": "medium"}, {"n": 12, "kind": "country", "hint": "A brand-new giant waterlily was found in a river in this country.", "level": "medium"}, {"n": 13, "kind": "country", "hint": "Messi played his last game for this country.", "level": "easy"}, {"n": 14, "kind": "country", "hint": "Floods hit this long, thin country's capital, Santiago.", "level": "medium"}, {"n": 15, "kind": "country", "hint": "This country reported its first-ever Ebola cases.", "level": "medium"}, {"n": 16, "kind": "country", "hint": "Formula 1 plans to race in this small country in the early 2030s.", "level": "hard"}, {"n": 17, "kind": "country", "hint": "The country at the center of the war in the news.", "level": "medium"}, {"n": 18, "kind": "country", "hint": "The kiwi-feather cloak came home to this island country.", "level": "easy"}, {"n": 19, "kind": "country", "hint": "The Tiramisu World Cup is held in this country.", "level": "easy"}, {"n": 20, "kind": "country", "hint": "A school is being turned into homes for families in this country.", "level": "easy"}, {"n": 21, "kind": "country", "hint": "Tommie Smith and John Carlos raised their fists at the 1968 Olympics in this country.", "level": "easy"}]}, ENDPOINT="https://script.google.com/macros/s/AKfycbyiJLzMMuM_bfCO4Ziy-X3F4LamSuAezX7LpQTuPrl3OH2rREOctxWkzUYlA4_eAJjO/exec", KIND={"country": "Country", "state": "US state", "sea": "Sea"};
const LS="nq-map-"+CFG.issue+"c";
let pins={}, guesses={}, hist=[], cur=null, left=0, sid=null;
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nm=$("#nm"),em=$("#em");
try{const s=JSON.parse(localStorage.getItem(LS)||"{}");pins=s.pins||{};guesses=s.guesses||{};hist=s.hist||[];left=s.left||0;nm.value=s.nm||"";em.value=s.em||"";sid=s.sid||null}catch(e){}
const store=()=>{try{localStorage.setItem(LS,JSON.stringify({pins,guesses,hist,left,nm:nm.value,em:em.value,sid}))}catch(e){}};
document.addEventListener("visibilitychange",()=>{if(document.hidden){left++;store()}});
nm.oninput=store;em.oninput=store;
$("#intro").innerHTML=CFG.intro;

const svg=d3.select("#map"), g=svg.append("g");
const proj=d3.geoNaturalEarth1(), path=d3.geoPath(proj);
let countries=null,states=null,k=1;
function size(){const r=svg.node().getBoundingClientRect();return [r.width,r.height]}
function draw(){
  if(!countries)return;
  const [W,H]=size();proj.fitExtent([[8,8],[W-8,H-8]],{type:"Sphere"});
  g.selectAll("*").remove();
  g.append("path").attr("class","sphere").attr("d",path({type:"Sphere"}));
  g.append("path").attr("class","grat").attr("d",path(d3.geoGraticule10()));
  g.append("g").selectAll("path").data(countries.features).join("path").attr("class","country").attr("d",path);
  g.append("path").attr("class","state").attr("d",path(states));
  g.append("g").attr("id","pins");
  drawPins();
}
const zoom=d3.zoom().scaleExtent([1,80]).on("zoom",e=>{k=e.transform.k;g.attr("transform",e.transform);drawPins()});
svg.call(zoom).on("dblclick.zoom",null);
svg.on("click",e=>{
  if(!cur){status("Pick a clue on the left first.");return}
  const t=d3.zoomTransform(svg.node()),[x,y]=t.invert(d3.pointer(e,svg.node()));
  const ll=proj.invert([x,y]);if(!ll||!isFinite(ll[0]))return;
  hist.push([cur,pins[cur]||null]);if(hist.length>60)hist.shift();
  pins[cur]={lon:+ll[0].toFixed(2),lat:+ll[1].toFixed(2)};store();
  const nx=CFG.places.find(p=>!pins[p.n]);
  if(nx){select(nx.n)}else{cur=null;renderClues();drawPins();status("All pins placed! Check your answers, then submit on the left.")}
});
function drawPins(){
  const sel=d3.select("#pins");if(sel.empty())return;
  const data=Object.entries(pins).map(([n,v])=>({n:+n,...v}));
  const s=sel.selectAll("g.pin").data(data,d=>d.n);
  const en=s.enter().append("g").attr("class","pin");en.append("circle");en.append("text");
  s.exit().remove();
  sel.selectAll("g.pin").each(function(d){
    const [x,y]=proj([d.lon,d.lat]);const p=d3.select(this);
    p.classed("cur",d.n===cur).attr("transform",`translate(${x},${y}) scale(${1/k})`);
    p.select("circle").attr("r",11);p.select("text").text(d.n);
  });
  $("#un").disabled=!hist.length;
}
function select(n){cur=n;renderClues();drawPins();
  status(`Clue ${n}: tap the map where you think this ${KIND[CFG.places.find(p=>p.n===n).kind].toLowerCase()} is.`+(pins[n]?" Tap again to move the pin.":""))}
function status(h){$("#status").innerHTML=h}
function renderClues(){
  const box=$("#clues"),act=document.activeElement,focusN=act&&act.dataset&&act.dataset.g;
  box.innerHTML=CFG.places.map(p=>`<div class="clue ${p.n===cur?"on":""} ${pins[p.n]?"done":""}" data-n="${p.n}"><div class="b">${p.n}</div><div>
    <div class="k">Mystery ${esc(KIND[p.kind].toLowerCase())}<span class="lv">${p.level||""}</span></div>
    <div class="h">${esc(p.hint)}</div>
    <input data-g="${p.n}" placeholder="Which ${esc(KIND[p.kind].toLowerCase())} is it? Type its name" value="${esc(guesses[p.n]||"")}" autocomplete="off">
    <div class="row">${pins[p.n]?`<span class="pinned">&#10003; Pin placed</span><button type="button" data-rm="${p.n}">Remove pin</button>`:`<span>No pin yet: tap the map</span>`}</div>
  </div></div>`).join("");
  if(focusN){const i=box.querySelector(`input[data-g="${focusN}"]`);if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
  const d=Object.keys(pins).length,gN=Object.values(guesses).filter(v=>v&&v.trim()).length;
  $("#prog").textContent=`${gN} of ${CFG.places.length} named · ${d} of ${CFG.places.length} pins placed`;
}
$("#clues").addEventListener("input",e=>{const n=e.target.dataset.g;if(!n)return;guesses[n]=e.target.value;store();
  const gN=Object.values(guesses).filter(v=>v&&v.trim()).length,d=Object.keys(pins).length;$("#prog").textContent=`${gN} of ${CFG.places.length} named · ${d} of ${CFG.places.length} pins placed`});
$("#clues").addEventListener("click",e=>{
  const rm=e.target.closest("[data-rm]");
  if(rm){const n=+rm.dataset.rm;hist.push([n,pins[n]||null]);delete pins[n];store();select(n);status(`Pin ${n} removed. Tap the map to place it again.`);return}
  const c=e.target.closest(".clue");if(c&&+c.dataset.n!==cur){select(+c.dataset.n)}
});
$("#un").onclick=()=>{const h=hist.pop();if(!h)return;const [n,prev]=h;if(prev)pins[n]=prev;else delete pins[n];store();cur=n;renderClues();drawPins();status(`Undone. Clue ${n} is selected.`)};
$("#zi").onclick=()=>svg.transition().call(zoom.scaleBy,2);
$("#zo").onclick=()=>svg.transition().call(zoom.scaleBy,.5);
$("#zr").onclick=()=>svg.transition().call(zoom.transform,d3.zoomIdentity);
addEventListener("resize",draw);

$("#go").onclick=async()=>{
  const out=$("#out");
  if(!ENDPOINT){out.innerHTML='<p class="note">Submissions open soon. Your answers are saved on this device.</p>';return}
  const name=nm.value.trim(),mail=em.value.trim();
  if(!name){nm.focus();out.innerHTML='<p class="note">Please type your first name.</p>';return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)){em.focus();out.innerHTML='<p class="note">Please type an email address for your score report.</p>';return}
  const placed=Object.keys(pins).length,named=Object.values(guesses).filter(v=>v&&v.trim()).length,N=CFG.places.length;
  if((placed<N||named<N)&&!confirm(`You named ${named} of ${N} places and placed ${placed} of ${N} pins. Send anyway?`))return;
  sid="mh"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);store();
  const go=$("#go");go.disabled=true;go.textContent="Sending...";
  try{
    const r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({issue:CFG.issue,id:sid,name,email:mail,pins,guesses,left})});
    const j=await r.json();if(!j.ok)throw new Error(j.error||"Something went wrong");
    out.innerHTML=`<p style="font-size:20px;margin:8px 0"><b>${j.score}</b> out of ${j.max} points!</p>`+
      `<p class="note">${j.emailed==="yes"?"Your score report is on its way to "+esc(mail)+".":"We saved your score, but the email didn't send. Tell your host."}</p>`+
      `<table class="res" style="width:100%;font-size:12.5px;border-collapse:collapse">`+j.per.map(p=>`<tr><td>Clue ${p.n}: ${esc(p.guess||"(blank)")} ${p.nameOk?"&#10003;":"&#10007;"}</td><td style="text-align:right;white-space:nowrap">${p.km===null?"no pin":p.km<=25?"inside!":p.km.toLocaleString()+" km away"}</td><td style="text-align:center"><b>${p.pts}</b></td></tr>`).join("")+`</table>`;
    go.disabled=false;go.textContent="Send again";out.innerHTML+=`<p class="note">Want to improve? Change your answers and press Send again. We'll go over the answers together at NewsQuest!</p>`;
  }catch(e){go.disabled=false;go.textContent="Submit my answers";out.innerHTML=`<p class="note">Couldn't send: ${esc(e.message)}. Check your internet and try again.</p>`}
};
(async()=>{const [W,S]=await Promise.all([fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json').then(r=>r.json()),fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json').then(r=>r.json())]);
  countries=topojson.feature(W,W.objects.countries);states=topojson.mesh(S,S.objects.states,(a,b)=>a!==b);draw()})();
renderClues();select(CFG.places.find(p=>!pins[p.n])?.n||1);
</script></body></html>
