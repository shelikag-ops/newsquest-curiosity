<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewsQuest Map Hunt: Issue 340</title>
<style>
:root{--navy:#14213d;--red:#d62839;--yellow:#ffd166;--sea:#cfe3f2;--land:#f4efe2;--line:#8a8f99;--ink:#1d2433}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);display:grid;grid-template-columns:350px 1fr;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/3;background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:14px}
header h1{font-size:19px;margin:0}header .p{margin-left:auto;font-size:13px;color:#c9d1e3}
aside{overflow:auto;background:#f6f7f9;border-right:1px solid #e3e6ec;padding:12px}
.intro{font-size:13.5px;background:#fff;border:1px solid #e3e6ec;border-radius:8px;padding:10px;margin-bottom:10px}
.clue{background:#fff;border:2px solid #e3e6ec;border-radius:10px;padding:8px 10px;margin:6px 0;cursor:pointer;display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start}
.clue.on{border-color:var(--red);box-shadow:0 0 0 3px #d628391f}
.clue .b{width:28px;height:28px;border-radius:50%;background:#e3e6ec;color:var(--navy);font-weight:700;display:grid;place-items:center;font-size:13px}
.clue.done .b{background:var(--navy);color:#fff}
.clue .nm{font-weight:650}.clue .h{font-size:13px;color:#4a5263}
.lv{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:#8a8f99;margin-left:4px}
#mapwrap{position:relative;background:var(--sea);overflow:hidden}
svg{width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
.country{fill:var(--land);stroke:var(--line);stroke-width:.6px;vector-effect:non-scaling-stroke}
.state{fill:none;stroke:#b3b7bf;stroke-width:.5px;vector-effect:non-scaling-stroke}
.grat{fill:none;stroke:#ffffff;stroke-width:.5px;vector-effect:non-scaling-stroke;opacity:.6}
.sphere{fill:var(--sea)}
.pin circle{fill:var(--red);stroke:#fff;stroke-width:2px;vector-effect:non-scaling-stroke}
.pin text{fill:#fff;font:700 11px system-ui;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin.cur circle{fill:var(--navy)}
.tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.tools button{width:38px;height:38px;border-radius:8px;border:1px solid #c8ccd4;background:#fff;font-size:20px;cursor:pointer}
.status{position:absolute;left:12px;bottom:12px;right:12px;background:#ffffffee;border-radius:8px;padding:8px 12px;font-size:14px;box-shadow:0 2px 8px #0002;pointer-events:none}
.sub{background:#fff;border:1px solid #e3e6ec;border-radius:10px;padding:10px;margin-top:12px}
.sub input,.sub select{font:inherit;width:100%;padding:7px;margin:4px 0;border:1px solid #c8ccd4;border-radius:6px}
.btn{font:inherit;font-weight:600;padding:9px 14px;border-radius:8px;border:0;background:var(--red);color:#fff;cursor:pointer;width:100%;margin-top:6px}
.btn.alt{background:var(--navy)}a.btn{display:block;text-align:center;text-decoration:none}
textarea.code{width:100%;min-height:90px;font:12px ui-monospace,Menlo,monospace;margin-top:6px}
.note{font-size:12.5px;color:#4a5263;margin-top:6px}
@media (max-width:800px){body{grid-template-columns:1fr;grid-template-rows:auto 55vh 1fr}aside{grid-row:3;border-right:0}#mapwrap{grid-row:2}}
</style></head><body>
<header><h1>NewsQuest Map Hunt: Issue 340</h1><div class="p" id="prog"></div></header>
<aside>
  <div class="intro" id="intro"></div>
  <div id="clues"></div>
  <div class="sub">
    <b>Done? Send your pins</b>
    <input id="nm" placeholder="Your first name" autocomplete="off">
    <select id="tm"><option value="">Your team</option><option>Red</option><option>Blue</option></select>
    <input id="em" type="email" placeholder="Email for your score report" autocomplete="email">
    <div class="note">A parent&apos;s email is fine. Your score report goes there.</div>
    <button class="btn" id="go">Submit my pins</button>
    <div id="out"></div>
  </div>
</aside>
<div id="mapwrap"><svg id="map"></svg>
  <div class="tools"><button id="zi" title="Zoom in">+</button><button id="zo" title="Zoom out">&minus;</button><button id="zr" title="Whole world">&#8962;</button></div>
  <div class="status" id="status"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
let WORLD=null, STATES=null; const CFG={"issue": "340", "date": "Oct 23, 2026", "title": "NewsQuest Map Hunt: Issue 340", "intro": "Every place below is in this week's Week Junior. The map has borders but no names. Use what you know, not a search engine! Pick a clue, then tap the map to drop your pin. Zoom in to be precise.", "places": [{"n": 1, "name": "Stockholm, Sweden", "hint": "Most Nobel Prizes are handed out here on December 10.", "level": "medium"}, {"n": 2, "name": "Oslo, Norway", "hint": "The Nobel Peace Prize is the only one given in this city.", "level": "medium"}, {"n": 3, "name": "Durban, South Africa", "hint": "Peace Prize winner Navi Pillay grew up in this port city on the Indian Ocean.", "level": "hard"}, {"n": 4, "name": "Paris, France", "hint": "The capital of the country where students marched for better schools.", "level": "easy"}, {"n": 5, "name": "The Bering Strait", "hint": "Karl Bushby walked across this frozen sea between Alaska and Russia.", "level": "hard"}, {"n": 6, "name": "The Caspian Sea", "hint": "Bushby swam across it from Kazakhstan to Azerbaijan. Put your pin in the water.", "level": "medium"}, {"n": 7, "name": "San Diego, California", "hint": "The USS Abraham Lincoln came home to this Navy city.", "level": "easy"}, {"n": 8, "name": "Worcester, Massachusetts", "hint": "The first national women's rights convention met here in 1850.", "level": "hard"}, {"n": 9, "name": "Chiricahua National Park, Arizona", "hint": "America's newest national park is in the southeast corner of this state.", "level": "medium"}, {"n": 10, "name": "Atlanta, Georgia", "hint": "Two giant pandas will make their US debut at this city's zoo.", "level": "easy"}, {"n": 11, "name": "The Inirida River, Colombia", "hint": "A brand-new giant waterlily was found in this river in eastern Colombia, near the border with Venezuela.", "level": "hard"}, {"n": 12, "name": "Buenos Aires, Argentina", "hint": "Messi played his last game for his country in its capital.", "level": "medium"}, {"n": 13, "name": "Santiago, Chile", "hint": "Floods hit this capital city, which sits at the foot of the Andes.", "level": "medium"}, {"n": 14, "name": "Nairobi, Kenya", "hint": "Kenya's capital, where its first-ever Ebola case was reported.", "level": "medium"}, {"n": 15, "name": "Kigali, Rwanda", "hint": "Formula 1 will race near this capital, Africa's first F1 race since 1993.", "level": "hard"}, {"n": 16, "name": "Borneo", "hint": "Rescued orangutans went back to the forests of this giant island shared by three countries.", "level": "medium"}, {"n": 17, "name": "Wellington, New Zealand", "hint": "The kiwi-feather cloak came home to the area around New Zealand's capital.", "level": "medium"}, {"n": 18, "name": "Treviso, Italy", "hint": "The Tiramisu World Cup is held in this city in northeast Italy, near Venice.", "level": "hard"}, {"n": 19, "name": "Ukraine", "hint": "A school is being turned into homes for families in this country. Pin anywhere inside it.", "level": "easy"}, {"n": 20, "name": "Mexico City, Mexico", "hint": "Tommie Smith and John Carlos raised their fists at the 1968 Olympics in this capital.", "level": "easy"}]}, FORM=null, ENDPOINT="https://script.google.com/macros/s/AKfycbyiJLzMMuM_bfCO4Ziy-X3F4LamSuAezX7LpQTuPrl3OH2rREOctxWkzUYlA4_eAJjO/exec";
const LS="nq-map-"+CFG.issue;
let pins={}, cur=null, left=0, sid=null;
try{const s=JSON.parse(localStorage.getItem(LS)||"{}");pins=s.pins||{};left=s.left||0;if(s.nm)document.getElementById("nm").value=s.nm;if(s.tm)document.getElementById("tm").value=s.tm;if(s.em)document.getElementById("em").value=s.em;if(s.sid)sid=s.sid}catch(e){}
const store=()=>{try{localStorage.setItem(LS,JSON.stringify({pins,left,nm:nm.value,tm:tm.value,em:em.value,sid}))}catch(e){}};
document.addEventListener("visibilitychange",()=>{if(document.hidden){left++;store()}});
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nm=$("#nm"),tm=$("#tm"),em=$("#em");nm.oninput=store;tm.oninput=store;em.oninput=store;
$("#intro").textContent=CFG.intro;

const svg=d3.select("#map"), g=svg.append("g");
const proj=d3.geoNaturalEarth1(), path=d3.geoPath(proj);
let countries=null,states=null;
function size(){const r=svg.node().getBoundingClientRect();return [r.width,r.height]}
let W,H;
function draw(){
  if(!countries)return;
  [W,H]=size();proj.fitExtent([[8,8],[W-8,H-8]],{type:"Sphere"});
  g.selectAll("*").remove();
  g.append("path").attr("class","sphere").attr("d",path({type:"Sphere"}));
  g.append("path").attr("class","grat").attr("d",path(d3.geoGraticule10()));
  g.append("g").selectAll("path").data(countries.features).join("path").attr("class","country").attr("d",path);
  g.append("path").attr("class","state").attr("d",path(states));
  g.append("g").attr("id","pins");
  drawPins();
}
let k=1;
const zoom=d3.zoom().scaleExtent([1,80]).on("zoom",e=>{k=e.transform.k;g.attr("transform",e.transform);drawPins()});
svg.call(zoom).on("dblclick.zoom",null);
svg.on("click",e=>{
  if(!cur){status("Pick a clue on the left first.");return}
  const t=d3.zoomTransform(svg.node()),[x,y]=t.invert(d3.pointer(e,svg.node()));
  const ll=proj.invert([x,y]);if(!ll||!isFinite(ll[0]))return;
  pins[cur]={lon:+ll[0].toFixed(2),lat:+ll[1].toFixed(2)};store();
  const nx=CFG.places.find(p=>!pins[p.n]);renderClues();drawPins();
  if(nx){select(nx.n)}else{cur=null;renderClues();status("All pins placed! Check them, then submit on the left.")}
});
function drawPins(){
  const r=11/k, data=Object.entries(pins).map(([n,v])=>({n:+n,...v}));
  const sel=d3.select("#pins").selectAll("g.pin").data(data,d=>d.n);
  const en=sel.enter().append("g").attr("class","pin");en.append("circle");en.append("text");
  sel.exit().remove();
  d3.select("#pins").selectAll("g.pin").each(function(d){
    const [x,y]=proj([d.lon,d.lat]);const s=d3.select(this);
    s.classed("cur",d.n===cur).attr("transform",`translate(${x},${y}) scale(${1/k})`);
    s.select("circle").attr("r",11);s.select("text").text(d.n);
  });
}
function select(n){cur=n;renderClues();drawPins();const p=CFG.places.find(p=>p.n===n);status(`Pin ${n}: tap where you think <b>${esc(p.name)}</b> is.`+(pins[n]?" Tap again to move it.":""))}
function status(h){$("#status").innerHTML=h}
function renderClues(){
  $("#clues").innerHTML=CFG.places.map(p=>`<div class="clue ${p.n===cur?"on":""} ${pins[p.n]?"done":""}" data-n="${p.n}"><div class="b">${p.n}</div><div><div class="nm">${esc(p.name)}<span class="lv">${p.level||""}</span></div><div class="h">${esc(p.hint)}</div></div></div>`).join("");
  const d=Object.keys(pins).length;$("#prog").textContent=`${d} of ${CFG.places.length} pins placed`;
}
$("#clues").addEventListener("click",e=>{const c=e.target.closest(".clue");if(c)select(+c.dataset.n)});
$("#zi").onclick=()=>svg.transition().call(zoom.scaleBy,2);
$("#zo").onclick=()=>svg.transition().call(zoom.scaleBy,.5);
$("#zr").onclick=()=>svg.transition().call(zoom.transform,d3.zoomIdentity);
addEventListener("resize",()=>{draw()});

function km(a,b){return d3.geoDistance([a.lon,a.lat],[b.lon,b.lat])*6371}
function score(){let s=0;const per=CFG.places.map(p=>{const q=pins[p.n];if(!q)return [p.n,null,0];const d=Math.max(0,km(p,q)-(p.r||0));const pt=d<=100?3:d<=400?2:d<=1000?1:0;s+=pt;return [p.n,Math.round(d),pt]});return {s,per,max:CFG.places.length*3}}
if(ENDPOINT!==null){$("#go").onclick=async()=>{
  if(!ENDPOINT){$("#out").innerHTML='<p class="note">Submissions open soon. Your pins are saved on this device.</p>';return}
  const name=nm.value.trim(),mail=em.value.trim(),out=$("#out");
  if(!name){nm.focus();out.innerHTML='<p class="note">Please type your first name.</p>';return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)){em.focus();out.innerHTML='<p class="note">Please type an email address for your score report.</p>';return}
  const placed=Object.keys(pins).length;
  if(placed<CFG.places.length&&!confirm(`You placed ${placed} of ${CFG.places.length} pins. Send anyway?`))return;
  if(!sid){sid="mh"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);store()}
  const go=$("#go");go.disabled=true;go.textContent="Sending...";
  try{
    const r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({issue:CFG.issue,id:sid,name,team:tm.value,email:mail,pins,left})});
    const j=await r.json();if(!j.ok)throw new Error(j.error||"Something went wrong");
    out.innerHTML=`<p style="font-size:20px;margin:8px 0"><b>${j.score}</b> out of ${j.max} points!</p>`+
      `<p class="note">${j.emailed==="yes"?"Your score report is on its way to "+esc(mail)+".":j.emailed==="already sent"?"You already sent these pins, so no new email.":"We saved your score, but the email didn't send. Tell your host."}</p>`+
      `<table style="width:100%;font-size:12.5px;border-collapse:collapse">`+j.per.map(p=>`<tr><td>${p.n}. ${esc(p.place)}</td><td style="text-align:right">${p.km===null?"no pin":p.km.toLocaleString()+" km"}</td><td style="text-align:center"><b>${p.pts}</b></td></tr>`).join("")+`</table>`;
    go.textContent="Sent!";
  }catch(e){go.disabled=false;go.textContent="Submit my pins";out.innerHTML=`<p class="note">Couldn't send: ${esc(e.message)}. Check your internet and try again.</p>`}
};}else
$("#go").onclick=()=>{
  const name=nm.value.trim();if(!name){nm.focus();$("#out").innerHTML='<p class="note">Please type your first name.</p>';return}
  const placed=Object.keys(pins).length;
  const sc=score();
  const ans=CFG.places.map(p=>pins[p.n]?`${p.n}:${pins[p.n].lat},${pins[p.n].lon}`:`${p.n}:-`).join(";");
  const code=`NQ${CFG.issue}|${name}|${tm.value||"-"}|${sc.s}/${sc.max}|placed ${placed}/${CFG.places.length}|left page ${left}x|${ans}`;
  let h=placed<CFG.places.length?`<p class="note">You placed ${placed} of ${CFG.places.length} pins. You can still add more, or send what you have.</p>`:"";
  if(FORM&&FORM.formUrl){
    const u=new URL(FORM.formUrl);u.searchParams.set("usp","pp_url");
    const E=FORM.entries||{};if(E.name)u.searchParams.set(E.name,name);if(E.team)u.searchParams.set(E.team,tm.value||"-");
    if(E.score)u.searchParams.set(E.score,`${sc.s}/${sc.max}`);if(E.answers)u.searchParams.set(E.answers,code);
    h+=`<p class="note"><b>Last step:</b> open the form and press its Submit button.</p><a class="btn alt" target="_blank" rel="noopener" href="${esc(u.toString())}">Open the form to finish</a>`;
  }else{
    h+=`<p class="note"><b>Last step:</b> copy this code and send it to your host.</p><textarea class="code" readonly>${esc(code)}</textarea><button class="btn alt" id="cp">Copy code</button>`;
  }
  $("#out").innerHTML=h;
  const cp=$("#cp");if(cp)cp.onclick=async()=>{const ta=$("#out textarea");ta.select();try{await navigator.clipboard.writeText(ta.value);cp.textContent="Copied!"}catch(e){cp.textContent="Selected: press Ctrl/Cmd+C"}};
};
(async()=>{[WORLD,STATES]=await Promise.all([fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json').then(r=>r.json()),fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json').then(r=>r.json())]);countries=topojson.feature(WORLD,WORLD.objects.countries);states=topojson.mesh(STATES,STATES.objects.states,(a,b)=>a!==b);draw()})();renderClues();select(CFG.places.find(p=>!pins[p.n])?.n||1);
</script></body></html>
