<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>News Treasure Hunt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#060C1C;--ink:#0F1B38;--panel:#1A2A52;--line:#2E4178;--text:#FFFFFF;--mist:#B9C4DE;--red:#D62839;--yellow:#FFC93C;--green:#1E7A45;--navytext:#0F1B38;
--display:"Anton",Impact,"Arial Narrow",sans-serif;--body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:600 1rem/1.45 var(--body);margin:0}
.wrap{max-width:760px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:4px solid var(--red);padding-bottom:10px;margin-bottom:16px}
.brand{font:400 1.5rem/1 var(--display);letter-spacing:.04em;flex:1;min-width:0}
.brand span{color:var(--yellow)}
.chip{background:var(--panel);border-radius:999px;padding:4px 12px;font-weight:900;font-size:.85rem}
.chip.t{font-variant-numeric:tabular-nums}
.card{background:var(--ink);border:1px solid var(--line);border-top:8px solid var(--yellow);border-radius:12px;padding:clamp(16px,4vw,28px)}
h1{margin:0 0 6px;font:400 clamp(2.2rem,8vw,3.6rem)/1 var(--display);letter-spacing:.01em;text-wrap:balance}
h2{margin:0 0 8px;font:400 clamp(1.6rem,5vw,2.3rem)/1.05 var(--display);letter-spacing:.01em;text-wrap:balance}
.kick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tag{background:var(--red);color:#fff;font:400 .95rem var(--display);letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:4px}
.step{color:var(--mist);font-weight:900;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
p{margin:0 0 12px}
.lead{font-size:1.1rem;font-weight:800}
.tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.tile{width:3rem;height:3.4rem;display:grid;place-items:center;background:#fff;color:var(--navytext);border-radius:8px;font:400 2rem/1 var(--display);box-shadow:0 4px 0 var(--yellow)}
.tile.gap{background:transparent;box-shadow:none;width:1rem}
.code{font:400 clamp(1.8rem,7vw,2.8rem)/1.1 var(--display);letter-spacing:.18em;text-align:center;color:var(--yellow);margin:10px 0;word-break:break-word}
.abc{overflow-x:auto;margin:6px 0 14px;background:var(--panel);border-radius:8px;padding:8px}
.abc table{border-collapse:collapse;margin:0 auto;font:900 .9rem var(--body)}
.abc th{color:var(--mist);font-weight:800;text-align:right;padding-right:8px;white-space:nowrap}
.abc td{width:1.45em;text-align:center;padding:2px 0}
.abc tr.c td{color:var(--yellow)}
.mapbox{background:#0B2A55;border-radius:10px;overflow:hidden;margin:10px 0 14px}
.mapbox svg{display:block;width:100%;height:auto;max-height:420px}
.mapbox path{fill:#E9E2CC;stroke:#8C8571;stroke-width:.7}
.mapbox .lab{font:900 15px var(--body);fill:#5C5440;letter-spacing:.1em}
.poem{background:#fff;color:var(--navytext);border-radius:10px;padding:12px 16px;margin:10px 0 14px;font-weight:800;line-height:1.55}
.poem p{margin:0 0 6px}.poem p:last-child{margin:0}.poem b{color:var(--red)}
.xt{display:grid;gap:6px;margin:10px 0 14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.xt div{background:#fff;color:var(--navytext);border-radius:8px;padding:8px 12px;font-weight:800;display:flex;gap:10px;align-items:center}
.xt .n{font:400 1.2rem var(--display);color:var(--red);min-width:1.1em}
.mapbox .gl{stroke:#ffffff;stroke-opacity:.35;stroke-width:.6;stroke-dasharray:3 3}
.mapbox .gt{font:900 8px var(--body);fill:#fff}
.mapbox .mk circle{fill:var(--red);stroke:#fff;stroke-width:1.5}
.mapbox .mk text{font:900 9px var(--body);fill:#fff}
.legend{list-style:none;padding:0;margin:-4px 0 14px;display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:800;color:var(--mist)}
.legend b{color:var(--yellow);margin-right:5px}
.fact{background:var(--panel);border-radius:8px;padding:10px 14px;font-weight:800;margin-top:10px}
.clues{list-style:none;padding:0;margin:10px 0 14px;display:grid;gap:8px}
.clues li{background:#fff;color:var(--navytext);border-radius:8px;padding:10px 14px;font-weight:900;display:flex;gap:10px;align-items:baseline}
.clues li b{font:400 1.3rem var(--display);color:var(--red)}
.clues li.hid{background:var(--panel);color:var(--mist);font-weight:800}
form.ans{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
form.ans input,form.start input{flex:1 1 220px;min-width:0;font:inherit;font-weight:900;font-size:1.15rem;padding:12px 16px;border-radius:999px;border:0;background:#fff;color:var(--navytext)}
.btn{border:0;border-radius:999px;padding:12px 22px;font:400 1.15rem var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;background:var(--red);color:#fff}
.btn.y{background:var(--yellow);color:var(--navytext)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--mist);font-size:.95rem;padding:8px 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.fb{min-height:1.5em;font-weight:900;margin:10px 0 0}
.fb.no{color:#FF8A94}.fb.ok{color:var(--yellow)}
.hint{background:var(--panel);border-left:5px solid var(--yellow);border-radius:6px;padding:8px 12px;font-weight:800;margin-top:10px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.bag{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}
.bag .lbl{color:var(--mist);font-weight:900;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
.slot{width:2.3rem;height:2.6rem;border-radius:6px;display:grid;place-items:center;font:400 1.5rem var(--display);background:var(--panel);color:var(--line)}
.slot.got{background:var(--yellow);color:var(--navytext)}
.win{text-align:center}
.word{font:400 clamp(1.8rem,6vw,2.6rem) var(--display);letter-spacing:.12em}
.word .hl{color:var(--navytext);background:var(--yellow);border-radius:4px;padding:0 4px}
.chest{font-size:clamp(4rem,16vw,6.5rem);line-height:1;margin:6px 0}
.team{font:400 clamp(2.2rem,9vw,4rem)/1 var(--display);color:var(--yellow);letter-spacing:.02em;word-break:break-word}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.stat{background:var(--panel);border-radius:10px;padding:10px 16px;min-width:140px}
.stat b{display:block;font:400 1.7rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;font-weight:900;color:var(--mist);text-transform:uppercase;letter-spacing:.06em}
.snap{background:var(--yellow);color:var(--navytext);border-radius:10px;padding:10px 16px;font-weight:900;font-size:1.1rem;margin:10px 0}
.recap{text-align:left;margin:16px 0 0;padding-left:1.2em;color:var(--mist);font-weight:800}
.recap li{margin:4px 0}
.confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--mist);font-weight:800}
.foot{margin-top:18px;color:var(--mist);font-size:.75rem;text-align:center}
</style>
</head><body>

<div class="wrap">
  <header class="top"><div class="brand">NewsQuest <span>Treasure Hunt</span></div><span class="chip" id="teamchip" hidden></span><span class="chip t" id="clock" hidden>0:00</span></header>
  <main id="app" aria-live="polite"></main>
  <p class="foot">Facts from ECDC and UN News (Ebola) and Al Jazeera (Iran war), November 2026.</p>
</div>

function poem(lines){return `<div class="poem">${lines.map(l=>`<p>${l}</p>`).join("")}</div>`}

const STAGES=[
 {tag:"Riddle",story:"Ebola",title:"Feeling the heat",word:"FEVER",pick:1,ans:["fever"],
  body:()=>`<p class="lead">🦠 Solve the letter riddle, one line at a time.</p>${poem(["My <b>1st</b> is in FOX but not in BOX.","My <b>2nd</b> is in EGG but not in DOG.","My <b>3rd</b> is in VAN but not in CAN.","My <b>4th</b> is in PEN but not in PIN.","My <b>5th</b> is in RAT but not in HAT.","My <b>whole</b> is when your body heats up to fight germs. It is often one of the first signs of Ebola."])}`,
  hint:"FOX and BOX share O and X, so the 1st letter is F. Do the same for each line.",
  fact:"A sudden fever is often one of the first signs of Ebola, a virus now making news in the Democratic Republic of the Congo (DRC)."},
 {tag:"Crack the code",story:"Ebola",title:"The secret message",word:"CONTACT TRACING",pick:0,ans:["contact tracing"],
  body:()=>`<p class="lead">🔍 To stop Ebola from spreading, health workers find everyone a sick person has been near, so they can check on them. What is this called? A spy moved every letter one step forward in the alphabet. Move each letter one step back to crack it.</p><div class="code">DPOUBDU USBDJOH</div>${abc()}`,
  hint:"D becomes C, and P becomes O. The first word starts with CON…",
  fact:"Contact tracing means finding everyone a sick person was close to, so health workers can watch them and stop the virus from spreading further."},
 {tag:"Acrostic",story:"Ebola",title:"The hidden line",word:"EQUATOR",pick:2,ans:["equator","the equator"],
  body:()=>`<p class="lead">🌍 This poem is hiding the name of an invisible line that runs right through the DRC. Can your team find it?</p>${poem(["<b>E</b>very map draws me, yet I’m not really there.","<b>Q</b>uietly I circle the planet’s middle.","<b>U</b>p north is one half, and down south is the other.","<b>A</b>t zero degrees, that’s where you’ll find me.","<b>T</b>he Congo rainforest steams wherever I pass.","<b>O</b>n my path, the noon sun climbs high all year.","<b>R</b>ound the whole world I go, like a belt."])}`,
  hint:"Read the first letter of each line, from top to bottom.",
  fact:"The equator is at 0 degrees latitude. It splits the Earth into the Northern and Southern Hemispheres, and it crosses the DRC."},
 {tag:"Coordinates",story:"Iran war",title:"Follow the numbers",word:"HORMUZ",pick:2,ans:["hormuz","strait of hormuz","ormuz"],
  body:()=>`<p class="lead">🗺️ Solve the riddle to get a map location. Then find the numbered spot that sits there.</p>${poem(["My <b>latitude</b> is the number of letters in the alphabet. Go that many degrees <b>north</b>.","My <b>longitude</b> is 30 more than my latitude. Go that many degrees <b>east</b>.","Ships carrying about a fifth of the world’s oil once sailed through me. Since the war, Iran has blocked most of them.","What is my name?"])}${mapSVG()}`,
  hint:"26 letters means 26° north, and 26 + 30 = 56° east. Look just above the 25°N line and just right of the 55°E line.",
  fact:"The Strait of Hormuz is a narrow waterway between Iran and Oman. Before the war, about a fifth of the world’s oil passed through it."},
 {tag:"Letter hunt",story:"Iran war",title:"The peacemaker",word:"PAKISTAN",pick:5,ans:["pakistan"],
  body:()=>`<p class="lead">🕵️ Who am I? In April, I helped two sides in the war agree to stop fighting, and peace talks were held in my capital. Pull one letter from each news word to spell my name.</p>
  <div class="xt">${[["1st","PEACE"],["3rd","CEASEFIRE"],["4th","TALKS"],["1st","IRAN"],["1st","SHIPS"],["2nd","STRAIT"],["2nd","WAR"],["1st","NEIGHBOR"]].map(([n,w],i)=>`<div><span class="n">${i+1}</span>The <b>${n}</b> letter of <b>${w}</b></div>`).join("")}</div>`,
  hint:"The first three letters are P, A and K.",
  fact:"Pakistan, Iran’s neighbor to the east, helped arrange the April ceasefire and hosted peace talks in its capital, Islamabad."},
 {tag:"Final lock",story:"The treasure",title:"Open the treasure chest",word:"TRUCE",pick:-1,ans:["truce"],
  body:()=>`<p class="lead">🔐 The last riddle opens the chest.</p>${poem(["When two sides agree to lay down their weapons for a while, I’m the word for that pause.","I’m five letters long, and I’m hiding in your secret bag.","I begin with the letter the peacemaker gave you."])}${tiles((S.letters||[]).join("")||"?????")}`,
  hint:"It starts with T, and the next letter is R.",
  fact:"A truce is an agreement to stop fighting for a while, like the ceasefire in the Iran war."}];
const LETTERS=["E","C","U","R","T"];

let tick=null;
function fmt(ms){const s=Math.max(0,Math.round(ms/1000)),m=Math.floor(s/60);return m+":"+String(s%60).padStart(2,"0")}
function header(){const tc=$("#teamchip"),ck=$("#clock");if(S.team){tc.hidden=false;tc.textContent="Team "+S.team}else tc.hidden=true;
 if(S.start){ck.hidden=false;ck.textContent="⏱ "+fmt((S.end||Date.now())-S.start)}else ck.hidden=true;
 clearInterval(tick);if(S.start&&!S.end)tick=setInterval(()=>{$("#clock").textContent="⏱ "+fmt(Date.now()-S.start)},1000)}
function bag(){return `<div class="bag"><span class="lbl">Secret letters</span>${LETTERS.map((c,i)=>`<span class="slot${(S.letters||[])[i]?" got":""}">${(S.letters||[])[i]||"?"}</span>`).join("")}</div>`}
function marked(w,p){return [...w].map((c,i)=>i===p?`<span class="hl">${esc(c)}</span>`:esc(c)).join("")}

function render(){header();const app=$("#app");
 if(!S.team){app.innerHTML=`<section class="card"><div class="kick"><span class="tag">Team mission</span></div><h1>The Great News Treasure Hunt</h1>
  <p class="lead">Crack 5 riddles and codes about Ebola and the Iran war. Each one gives your team a secret letter, and some answers unlock the next puzzle, so solve them in order. A final riddle opens the treasure chest!</p>
  <p>Tip: answers don’t need capital letters, and small spelling slips are OK. Every hint you use shows on your finish screen.</p>
  <form class="start" id="startf"><input id="tname" maxlength="30" placeholder="Type your team name" aria-label="Team name" autocomplete="off"><button class="btn" type="submit">Start the hunt</button></form></section>`;
  $("#startf").onsubmit=e=>{e.preventDefault();const v=$("#tname").value.trim();if(!v){$("#tname").focus();return}S={team:v,start:Date.now(),stage:0,letters:[],hints:0};save();render()};return}
 if(S.end){const t=new Date(S.end);app.innerHTML=`<section class="card win"><div class="chest">💰</div><h1>Treasure found!</h1><div class="team">${esc(S.team)}</div>
  <div class="stats"><div class="stat"><b>${t.toLocaleTimeString([],{hour:"numeric",minute:"2-digit",second:"2-digit"})}</b><span>Finished at</span></div><div class="stat"><b>${fmt(S.end-S.start)}</b><span>Total time</span></div><div class="stat"><b>${S.hints||0}</b><span>Hints used</span></div></div>
  <div class="word">T R U C E</div>
  <div class="snap">📸 Take a screenshot of this screen and send it in the Zoom chat!</div>
  <ol class="recap"><li>A fever is often one of the first signs of Ebola, which is making news in the DRC.</li><li>Contact tracing helps stop it from spreading.</li><li>The equator runs through the DRC.</li><li>Iran has blocked most ships in the Strait of Hormuz.</li><li>Pakistan helped arrange a truce in the Iran war.</li></ol>
  <div class="row" style="justify-content:center"><button class="btn ghost" id="again" type="button">Start over</button></div></section>`;
  $("#again").onclick=askReset;return}
 const i=S.stage,st=STAGES[i];S.cl=S.cl||0;
 const solved=S.solved===i;
 let h=`<section class="card" id="stagecard"><div class="kick"><span class="tag">${esc(st.tag)}</span><span class="step">Puzzle ${i+1} of ${STAGES.length} · ${esc(st.story)}</span></div><h2>${esc(st.title)}</h2>${st.body(S)}`;
 if(solved){h+=`<p class="fb ok">🔓 Correct!${st.pick>=0?` You collected the letter <b>${esc(st.word[st.pick])}</b>.`:""}</p>${st.pick>=0?`<div class="word">${marked(st.word,st.pick)}</div>`:""}<div class="fact">📰 ${esc(st.fact)}</div><div class="row"><button class="btn y" id="next" type="button">${i+1<STAGES.length?"Next puzzle":"Open the chest"}</button></div>`}
 else{h+=`<form class="ans" id="ansf"><input id="ain" placeholder="Type your team’s answer" aria-label="Answer" autocomplete="off" spellcheck="false"><button class="btn" type="submit">Unlock</button></form><p class="fb no" id="fb"></p>
  ${S.hint===i?`<div class="hint">💡 ${esc(st.hint)}</div>`:`<div class="row"><button class="btn ghost" id="hintb" type="button">Need a hint?</button></div>`}`}
 h+=bag()+`<div class="row"><span id="rs"><button class="btn ghost" id="reset" type="button">Start over</button></span></div></section>`;
 app.innerHTML=h;
 const hb=$("#hintb");if(hb)hb.onclick=()=>{S.hint=i;S.hints=(S.hints||0)+1;save();render()};
 $("#reset").onclick=askReset;
 const nx=$("#next");if(nx)nx.onclick=()=>{if(i+1>=STAGES.length){S.end=S.endAt||Date.now()}else{S.stage=i+1;S.cl=0}save();render();window.scrollTo(0,0)};
 const f=$("#ansf");if(f){$("#ain").focus({preventScroll:true});f.onsubmit=e=>{e.preventDefault();const v=$("#ain").value;
  if(ok(v,st.ans)){if(st.pick>=0)S.letters[i]=st.word[st.pick];S.solved=i;if(i+1>=STAGES.length)S.endAt=Date.now();save();render()}
  else{const fb=$("#fb");fb.textContent=norm(v)?"Not quite. Try again!":"Type an answer first.";const c=$("#stagecard");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake")}}}}
function askReset(){const r=$("#rs")||$("#again").parentNode;r.innerHTML=`<span class="confirm">Start the whole hunt over? <button class="btn ghost" id="rno" type="button">Keep going</button><button class="btn" id="ryes" type="button">Start over</button></span>`;
 $("#rno").onclick=render;$("#ryes").onclick=()=>{S={};save();render()}}
render();
</script>
</body></html>
